<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Furniture</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f5f5;color:#222}
header{background:#222;color:#fff;padding:18px 15px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;color:#ddd}
.container{max-width:900px;margin:auto;padding:15px}
.admin{background:#fff;padding:18px;border-radius:12px;margin:15px 0;box-shadow:0 2px 8px #0001}
.admin h2{margin-top:0}
input,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
textarea{min-height:90px;resize:vertical}
button{background:#222;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:220px;object-fit:cover;background:#eee}
.card .info{padding:14px}
.price{font-size:20px;font-weight:bold;margin:8px 0}
.contact{display:flex;gap:8px}
.contact a{flex:1;text-align:center;padding:10px;background:#eee;color:#222;text-decoration:none;border-radius:7px}
.status{text-align:center;margin:8px 0;font-weight:bold}
.empty{text-align:center;padding:30px;background:#fff;border-radius:12px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>

<header>
  <h1>JP Furniture</h1>
  <p>পুরাতন ও মানসম্মত ফার্নিচার</p>
</header>

<div class="container">

<section class="admin">
  <h2>➕ নতুন পণ্য যোগ করুন</h2>
  <p class="small">ছবি, নাম, দাম ও বিবরণ দিয়ে অনলাইনে প্রকাশ করুন।</p>

  <input id="photo" type="file" accept="image/*">
  <input id="name" type="text" placeholder="ফার্নিচারের নাম">
  <input id="price" type="number" placeholder="দাম (টাকা)">
  <textarea id="description" placeholder="ফার্নিচারের বিবরণ"></textarea>
  <button id="publishBtn" onclick="publishProduct()">অনলাইনে প্রকাশ করুন</button>
  <div id="status" class="status"></div>
</section>

<h2>🛋️ আমাদের ফার্নিচার</h2>
<div id="products" class="products">
  <div class="empty">পণ্য লোড হচ্ছে...</div>
</div>

</div>

<script>
const SUPABASE_URL = "https://jmekommypqtgncpgywtb.supabase.co";
const SUPABASE_KEY = "sb_publishable_msXh_y2f2fXcHu7Lz2S5qg_mnz80seN";
const BUCKET = "furniture-images";

function headers(extra={}) {
  return Object.assign({
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json"
  }, extra);
}

async function loadProducts(){
  const box = document.getElementById("products");
  try{
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/products?select=*&order=created_at.desc",
      {headers: headers()}
    );
    if(!res.ok) throw new Error(await res.text());
    const data = await res.json();

    if(!data.length){
      box.innerHTML = '<div class="empty">এখনও কোনো পণ্য যোগ করা হয়নি।</div>';
      return;
    }

    box.innerHTML = data.map(p => `
      <div class="card">
        ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name || 'Furniture')}">` : ''}
        <div class="info">
          <h3>${escapeHtml(p.name || '')}</h3>
          <div class="price">${p.price ? Number(p.price).toLocaleString('bn-BD') + ' টাকা' : 'দাম জানতে যোগাযোগ করুন'}</div>
          <p>${escapeHtml(p.description || '')}</p>
          <div class="contact">
            <a href="tel:01915813242">📞 কল করুন</a>
            <a href="https://wa.me/8801915813242" target="_blank">WhatsApp</a>
          </div>
        </div>
      </div>
    `).join("");
  }catch(e){
    box.innerHTML = '<div class="empty">পণ্য লোড করা যাচ্ছে না। Supabase সেটিংস পরীক্ষা করুন।</div>';
    console.error(e);
  }
}

async function publishProduct(){
  const btn = document.getElementById("publishBtn");
  const status = document.getElementById("status");
  const photo = document.getElementById("photo").files[0];
  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value;
  const description = document.getElementById("description").value.trim();

  if(!photo || !name || !price){
    status.textContent = "ছবি, নাম ও দাম দিন।";
    return;
  }

  btn.disabled = true;
  status.textContent = "আপলোড হচ্ছে...";

  try{
    const safeName = photo.name.replace(/[^a-zA-Z0-9._-]/g,"-");
    const filePath = Date.now() + "-" + safeName;

    const upload = await fetch(
      SUPABASE_URL + "/storage/v1/object/" + BUCKET + "/" + encodeURIComponent(filePath),
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "x-upsert":"false",
          "Content-Type":photo.type || "application/octet-stream"
        },
        body:photo
      }
    );

    if(!upload.ok) throw new Error("ছবি আপলোড হয়নি: " + await upload.text());

    const imageUrl =
      SUPABASE_URL + "/storage/v1/object/public/" + BUCKET + "/" + encodeURIComponent(filePath);

    const insert = await fetch(
      SUPABASE_URL + "/rest/v1/products",
      {
        method:"POST",
        headers:Object.assign({}, headers(), {"Prefer":"return=minimal"}),
        body:JSON.stringify({
          name:name,
          price:Number(price),
          description:description,
          image_url:imageUrl
        })
      }
    );

    if(!insert.ok) throw new Error("পণ্য যোগ হয়নি: " + await insert.text());

    status.textContent = "✅ পণ্য সফলভাবে অনলাইনে প্রকাশ হয়েছে!";
    document.getElementById("photo").value="";
    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("description").value="";
    await loadProducts();
  }catch(e){
    console.error(e);
    status.textContent = "❌ সমস্যা হয়েছে। আবার চেষ্টা করুন।";
  }finally{
    btn.disabled = false;
  }
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadProducts();
</script>
</body>
</html>
